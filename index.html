<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dummy Metronome Pro</title>

    

    
    <style>
        /* ================= CSS：色彩变量与主题 ================= */
        :root {
            --bg-color: #f2f2f2;
            --app-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #555555;
            --card-bg: #f9f9f9;
            --border-color: #eeeeee;
            --btn-off-bg: #e0e0e0;
            --btn-off-text: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --app-bg: #2d2d2d;
            --text-main: #f0f0f0;
            --text-sub: #aaaaaa;
            --card-bg: #383838;
            --border-color: #444444;
            --btn-off-bg: #444444;
            --btn-off-text: #cccccc;
        }

        /* ================= CSS：骨架与排版 ================= */
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            transition: background-color 0.3s;
        }
        .app-container {
            background-color: var(--app-bg);
            width: 90%;
            max-width: 360px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            transition: background-color 0.3s;
        }
        
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-main);
        }

        .blinker-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            height: 20px; 
            align-items: center;
        }

        .blinker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: background-color 0.05s, box-shadow 0.05s, transform 0.05s;
        }
        .blinker.flash-accent {
            background-color: #FF6B6B;
            box-shadow: 0 0 15px #FF6B6B;
            transform: scale(1.2); 
        }
        .blinker.flash-normal {
            background-color: #4CAF50;
            box-shadow: 0 0 12px #4CAF50;
            transform: scale(1.1); 
        }

        .bpm-label {
            display: inline-block;
            background-color: var(--card-bg);
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-sub);
        }
        .bpm-value {
            font-size: 80px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        input[type=range] {
            width: 80%;
            margin-bottom: 25px;
        }
        .vol-slider {
            width: 60% !important;
            margin-bottom: 0 !important;
        }
        .btn {
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .play-btn {
            background-color: var(--app-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            margin-bottom: 15px;
        }
        .play-btn.playing {
            background-color: #FF6B6B;
            color: white;
            border-color: #FF6B6B;
        }
        .dummy-btn {
            background-color: var(--btn-off-bg);
            color: var(--btn-off-text);
            margin-bottom: 20px;
        }
        .dummy-btn.active {
            background-color: #FF6B6B;
            color: white;
        }
        .controls-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            text-align: left;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 10px;
        }
        .control-row:last-child {
            margin-bottom: 0;
        }
        select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--app-bg);
            color: var(--text-main);
            font-size: 14px;
        }
        /* 专属开发者签名 */
        .watermark {
            position: fixed;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #999999;
            font-family: 'Courier New', Courier, monospace; /* 使用类似代码的字体，更有 Lab 的感觉 */
            letter-spacing: 1px;
            z-index: 100;
            transition: color 0.3s;
        }

        /* 夜间模式下让签名变得更暗沉一点，不刺眼 */
        [data-theme="dark"] .watermark {
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>

        <div class="blinker-container" id="blinkerContainer"></div>

        <div class="bpm-label">BPM</div>
        <div class="bpm-value" id="bpmDisplay">60</div>
        
        <input type="range" id="bpmSlider" min="40" max="320" value="60">
        
        <button class="btn play-btn" id="playBtn" onclick="togglePlay()">▶ 开始</button>
        <button class="btn dummy-btn" id="dummyBtn" onclick="toggleDummy()">Become a dunmmy: OFF</button>

        <div class="controls-card">
            <div class="control-row">
                <span>🔊 音量</span>
                <input type="range" id="volSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
            
            <div class="control-row">
                <span>每小节拍数</span>
                <select id="beatSelect">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>

            <!-- ================= 新增：连续静音拍数选择器 ================= -->
            <div class="control-row">
                <span>🔕 连续静音拍数</span>
                <select id="muteDurationSelect">
                    <option value="1">1 拍</option>
                    <option value="2">2 拍</option>
                    <option value="3">3 拍</option>
                    <option value="4">4 拍</option>
                    <option value="8">8 拍</option>
                </select>
            </div>
        </div>

        <div class="controls-card">
            <div class="control-row">
                <span>节奏细分</span>
                <select id="rhythmSelect">
                    <option value="quarter">四分音符 (♩)</option>
                    <option value="eighth">八分音符 (♫)</option>
                    <option value="triplet">三连音</option>
                    <option value="sixteenth">十六分音符 (♬)</option>
                    <option value="dotted">八分附点 (♪. ♬)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let isPlaying = false;
        let isDummyMode = false;
        let bpm = 60;
        let currentVolume = 0.8;
        
        let measureBeat = 1;      
        let subBeatIndex = 0;     
        let isMutedBeat = false;  

        // ================= 新增：记录当前还要静音多少拍 =================
        let mutedBeatsRemaining = 0; 

        const rhythms = {
            "quarter": [1.0],
            "eighth": [0.5, 0.5],
            "triplet": [1/3, 1/3, 1/3],
            "sixteenth": [0.25, 0.25, 0.25, 0.25],
            "dotted": [0.75, 0.25]
        };

        const bpmDisplay = document.getElementById("bpmDisplay");
        const bpmSlider = document.getElementById("bpmSlider");
        const volSlider = document.getElementById("volSlider");
        const playBtn = document.getElementById("playBtn");
        const dummyBtn = document.getElementById("dummyBtn");
        const beatSelect = document.getElementById("beatSelect");
        const rhythmSelect = document.getElementById("rhythmSelect");
        const muteDurationSelect = document.getElementById("muteDurationSelect"); // 新增
        const blinkerContainer = document.getElementById("blinkerContainer");
        const themeToggleBtn = document.getElementById("themeToggle");

        let audioContext;
        let timerID;

        function renderBlinkers() {
            const beats = parseInt(beatSelect.value);
            blinkerContainer.innerHTML = ''; 
            
            for (let i = 0; i < beats; i++) {
                const dot = document.createElement("div");
                dot.className = "blinker";
                dot.id = "blinker-" + i; 
                blinkerContainer.appendChild(dot);
            }
        }
        
        beatSelect.addEventListener("change", renderBlinkers);
        renderBlinkers();

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeToggleBtn.innerText = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerText = '☀️';
            }
        }

        bpmSlider.addEventListener("input", function() {
            bpm = parseInt(bpmSlider.value);
            bpmDisplay.innerText = bpm;
        });

        volSlider.addEventListener("input", function() {
            currentVolume = parseFloat(volSlider.value);
        });

        function flashBlinker(type, beatIndex) {
            const targetBlinker = document.getElementById("blinker-" + beatIndex);
            if (!targetBlinker) return;

            targetBlinker.className = 'blinker'; 
            void targetBlinker.offsetWidth; 
            targetBlinker.classList.add('flash-' + type);
            
            setTimeout(() => {
                targetBlinker.classList.remove('flash-' + type);
            }, 70);
        }

        function playBeep(isAccent) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            osc.frequency.value = isAccent ? 1000 : 800;
            
            gainNode.gain.setValueAtTime(currentVolume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
            
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.1);
        }

        function nextNote() {
            const currentRhythm = rhythms[rhythmSelect.value];
            const beatsPerMeasure = parseInt(beatSelect.value);

            // ================= 核心静音计时器逻辑 =================
            if (subBeatIndex === 0) {
                // 如果当前还在连续静音的倒数周期内
                if (mutedBeatsRemaining > 0) {
                    isMutedBeat = true;
                    mutedBeatsRemaining--; // 消耗掉一拍静音额度
                } 
                // 如果当前没有在静音周期内，进行常规的掷骰子
                else {
                    if (isDummyMode && Math.random() < 0.3) {
                        isMutedBeat = true;
                        // 读取用户选择的静音拍数，减去当前这1拍，存入剩余额度中
                        const selectedDuration = parseInt(muteDurationSelect.value);
                        mutedBeatsRemaining = selectedDuration - 1; 
                    } else {
                        isMutedBeat = false;
                    }
                }
            }

            if (!isMutedBeat) {
                const currentLightIndex = measureBeat - 1;

                if (measureBeat === 1 && subBeatIndex === 0) {
                    playBeep(true); 
                    flashBlinker('accent', currentLightIndex); 
                } else {
                    playBeep(false); 
                    flashBlinker('normal', currentLightIndex); 
                }
            }

            const fraction = currentRhythm[subBeatIndex];
            const delayMs = (60 / bpm) * fraction * 1000;

            subBeatIndex++;
            if (subBeatIndex >= currentRhythm.length) {
                subBeatIndex = 0;
                measureBeat++;
                if (measureBeat > beatsPerMeasure) {
                    measureBeat = 1;
                }
            }

            timerID = setTimeout(nextNote, delayMs);
        }

        function togglePlay() {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.innerText = "■ 停止";
                playBtn.classList.add("playing");
                measureBeat = 1;
                subBeatIndex = 0;
                mutedBeatsRemaining = 0; // 每次重新开始时，清空静音倒数
                renderBlinkers();
                nextNote(); 
            } else {
                playBtn.innerText = "▶ 开始";
                playBtn.classList.remove("playing");
                clearTimeout(timerID); 
            }
        }

        function toggleDummy() {
            isDummyMode = !isDummyMode;
            if (isDummyMode) {
                dummyBtn.innerText = "🥷 Become a dunmmy: ON";
                dummyBtn.classList.add("active");
            } else {
                dummyBtn.innerText = "Become a dunmmy: OFF";
                dummyBtn.classList.remove("active");
                mutedBeatsRemaining = 0; // 只要关闭 Dummy 模式，立刻清空静音倒数，恢复声音
            }
        }
    </script>
    <!-- 专属签名 -->
    <div class="watermark">Glen's Lab</div>
</body>
</html>
